name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Build & Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          envs: VITE_OPENAI_API_KEY
          script: |
            set -e
            cd /www/wwwroot/github/hub-slidust
            # Force-sync to remote — the server's .htaccess is sometimes rewritten
            # by the panel, which would make a plain `git pull` abort.
            git fetch origin main
            git reset --hard origin/main
            npm ci --legacy-peer-deps
            # .env may be owned by another user (created at setup) — remove then
            # recreate so the deploy user can always overwrite it.
            rm -f .env
            printf 'VITE_OPENAI_API_KEY=%s\n' "$VITE_OPENAI_API_KEY" > .env
            npm run build
            echo "✅ Deploy selesai: $(date)"
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
